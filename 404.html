<!doctype html>
<meta charset="utf-8">
<title>Moved</title>
<!--
  Catch-all redirect for repositories moved to rchain-community.

  The per-directory stubs only answer the roots (/quantum-os/). Everything
  deeper — /quantum-logical-framework/spacetime_constructor.html, and every other
  page, asset and anchor ever linked — lands here instead, because GitHub Pages
  serves this file for any path it cannot match.

  So rewrite the whole path rather than the root: keep everything after the
  project name, and carry search and hash across. That covers deep links without
  mirroring a single file.

  GitHub Pages returns this with a 404 status, which it must; the browser still
  follows the redirect. A crawler sees 404, a reader sees the page they asked for.
-->
<script>
  (function () {
    var m = location.pathname.match(/^\/(quantum-os|quantum-logical-framework)(\/.*)?$/);
    if (m) {
      location.replace("https://rchain-community.github.io/" + m[1] + (m[2] || "/")
                       + location.search + location.hash);
    }
  })();
</script>
