<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      if (
        location.protocol === "http:" &&
        /(^|\.)jimscarver\.com$/.test(location.hostname)
      ) {
        location.replace(
          "https://jimscarver.com" +
            location.pathname +
            location.search +
            location.hash,
        );
      }
    </script>
    <title>Page not found — Jim Whitescarver</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#fcfbf7" />
    <script>
      // Preserve the old Pages deep links for repositories moved to
      // rchain-community. GitHub Pages serves this file for any unmatched
      // path, so keep the whole path, query and hash when redirecting.
      (function () {
        var m = location.pathname.match(
          /^\/(quantum-os|quantum-logical-framework)(\/.*)?$/,
        );
        if (m) {
          location.replace(
            "https://rchain-community.github.io/" +
              m[1] +
              (m[2] || "/") +
              location.search +
              location.hash,
          );
        }
      })();
    </script>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          // Default to the light palette.
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site">
      <div class="window">
        <header class="window-header">
          <a class="brand" href="/">Jim Whitescarver</a>
          <nav class="header-links" aria-label="Profiles and contact">
            <a href="/">Home</a>
            <a href="https://github.com/jimscarver" rel="noopener noreferrer"
              >GitHub</a
            >
            <a href="mailto:jim@njit.edu">Email</a>
          </nav>
        </header>
        <main class="panel" id="main">
          <p class="descriptor">404 · Not in the record</p>
          <h1 class="case-title">This page is not here.</h1>
          <p class="case-subtitle">
            The address may have moved, or it may never have existed. The record
            begins at the front door.
          </p>
          <p><a href="/">Return to jimscarver.com →</a></p>
        </main>
        <footer class="window-footer">
          <span>© 2026 Jim Whitescarver · Tampa, Florida</span>
          <span>Set in IBM Plex Mono</span>
        </footer>
      </div>
    </div>
  </body>
</html>
