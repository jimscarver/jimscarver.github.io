<!--
  Quantum Logical Framework moved to the rchain-community organisation.

  This stub exists because GitHub Pages URLs do not redirect on transfer, and the
  path is bound to a repository name: jimscarver.github.io/quantum-logical-framework/ can only be
  served by a repo called "quantum-logical-framework" in this account — and that name has to stay
  free, or the github.com redirect for the repository itself stops working.

  A user-site path serves whenever no project repo claims it, so this restores the
  old address without taking the name.

  The redirect is scripted rather than a meta refresh so that location.search and
  location.hash survive it. Room links are fragments — .../quantum-logical-framework/#room=cap:room:…
  — and a meta refresh would drop them, which would break every link ever shared.
-->
<script>
  location.replace("https://rchain-community.github.io/quantum-logical-framework/" + location.search + location.hash);
</script>
